name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Build Release Binary
        run: cargo build --release

      - name: Create Release Package
        run: |
          mkdir -p staging
          cp target/release/kotonoha staging/
          cp README.md LICENSE config.toml.example staging/ 2>/dev/null || true
          tar -czvf kotonoha-x86_64-unknown-linux-gnu.tar.gz -C staging .

      - name: Generate Dynamic Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          echo "## 🌸 言の葉 (kotonoha) ${{ github.ref_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📝 Changes in this release" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..${{ github.ref_name }} --oneline --no-merges | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
          else
            git log -n 10 --oneline --no-merges | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "### 🪄 Quick Installation" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo 'curl -sSL https://raw.githubusercontent.com/Praveensenpai/kotonoha/main/install.sh | bash' >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🌸 kotonoha ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: kotonoha-x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
